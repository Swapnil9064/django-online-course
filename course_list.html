{% extends 'onlinecourse/base.html' %}{% block content %}<h1>Available Courses</h1><div class='row'>{% for course in courses %}<div class='col-md-6'><div class='card my-3'><div class='card-body'><h5>{{ course.name }}</h5><p>{{ course.description }}</p><a class='btn btn-primary' href='{% url "onlinecourse:course_details" course.id %}'>View course and exam</a></div></div></div>{% empty %}<p>No courses yet. Add one in <a href='/admin/'>Django Admin</a>.</p>{% endfor %}</div>{% endblock %}
